<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <style>
      .t{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;animation:f 1.2s ease-out .2s both}
      .d{font:400 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#3DDC84;letter-spacing:2px;animation:f 1.2s ease-out .7s both}
      .w{animation:m 8s ease-in-out infinite alternate}
      @keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes m{from{transform:translateX(0)}to{transform:translateX(-60px)}}
    </style>
  </defs>
  <rect width="1200" height="170" fill="url(#g)"/>
  <g class="w">
    <path d="M0 160 C200 210 400 120 600 160 S1000 200 1260 150 V0 H0 Z" fill="url(#g)"/>
    <path d="M0 170 C220 215 420 140 620 175 S1020 210 1260 165 V0 H0 Z" fill="url(#g)" opacity=".55"/>
  </g>
  <text class="t" x="600" y="95" text-anchor="middle">Adrià Casas</text>
  <text class="d" x="600" y="135" text-anchor="middle">FULL-STACK WEB &amp; MOBILE DEVELOPER</text>
</svg>
